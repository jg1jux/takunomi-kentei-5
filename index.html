<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宅飲み検定5級</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>宅飲み検定5級</h1>
        <p>気軽に挑戦できる、宅飲み知識のミニ検定（全10問）</p>
      </header>

      <section id="start-screen" class="card">
        <h2>受験者情報</h2>
        <p class="lead">受験者名を入力して検定を開始してください。</p>
        <label for="candidate-name">受験者名</label>
        <input
          id="candidate-name"
          type="text"
          inputmode="text"
          autocomplete="name"
          placeholder="例: Yuichiro Yoshida"
          maxlength="40"
        />
        <p class="help">※ 英字名・日本語名どちらでも入力できます。</p>
        <button id="start-btn" class="btn primary">受験開始</button>
        <p id="start-error" class="error" aria-live="polite"></p>
      </section>

      <section id="quiz-screen" class="card hidden" aria-live="polite">
        <div class="quiz-meta">
          <p id="progress"></p>
          <p id="score-preview"></p>
        </div>
        <h2 id="question-text"></h2>
        <div id="choices" class="choices"></div>
      </section>

      <section id="result-screen" class="card hidden">
        <h2>検定結果</h2>
        <p id="result-name"></p>
        <p id="result-score" class="result-score"></p>
        <p id="result-status" class="result-status"></p>
        <button id="retry-btn" class="btn secondary hidden">再受験する</button>
      </section>

      <section id="certificate-screen" class="hidden">
        <article id="certificate" class="certificate" aria-label="宅飲み検定5級 認定証">
          <p class="certificate-kicker">日本生活嗜好技能検定協会 公式認定</p>
          <h2>宅飲み検定5級 認定証</h2>
          <p class="certificate-body">下記の者は、宅飲みに関する基礎知識を修得したことをここに認定します。</p>
          <p id="certificate-name" class="certificate-name"></p>
          <div class="certificate-footer">
            <div>
              <p id="certificate-number"></p>
              <p id="certificate-date"></p>
            </div>
            <div class="issuer">
              <p>認定団体</p>
              <p>日本生活嗜好技能検定協会</p>
            </div>
          </div>
        </article>
        <div class="actions">
          <button id="print-btn" class="btn primary">認定証を印刷</button>
          <button id="new-exam-btn" class="btn secondary">もう一度受験する</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
